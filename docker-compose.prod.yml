services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-social_planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published ports — only reachable by other containers on this network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Runs once on deploy: applies pending migrations, then exits. `docker
  # compose up` restarts exited one-off services on their normal restart
  # policy, so this uses "no" — rerun it explicitly after a deploy instead:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      target: worker
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env.production
    depends_on:
      - postgres

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  worker-publish:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/workers/publish.ts"]
    env_file: .env.production
    depends_on:
      - postgres
      - redis

  worker-tokens:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/workers/token-refresh.ts"]
    env_file: .env.production
    depends_on:
      - postgres
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production # needs DOMAIN= for the Caddyfile's automatic HTTPS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
